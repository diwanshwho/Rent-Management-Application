<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Rent Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Mobile Header -->
    <header class="sticky top-0 z-30 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between md:hidden">
        <button onclick="toggleSidebar()" class="p-1 rounded-lg hover:bg-gray-100">
            <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <h1 class="text-lg font-semibold text-gray-800">Notifications</h1>
        <div class="w-6"></div>
    </header>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white border-r border-gray-200 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-200">
        <div class="p-5 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center"><span class="text-lg">🏠</span></div>
                <span class="text-lg font-bold text-gray-800">Rent Manager</span>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <span class="text-lg">📊</span> Dashboard
            </a>
            <a href="notifications.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700">
                <span class="text-lg">🔔</span> Notifications
            </a>
        </nav>
        <div class="absolute bottom-4 left-4 right-4">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-red-50 hover:text-red-600 transition-colors">
                <span class="text-lg">🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="md:ml-64 pb-24 md:pb-6">
        <div class="max-w-4xl mx-auto px-4 py-6 md:py-8">

            <!-- Page Header -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 hidden md:block">Notifications</h1>
                    <p class="text-sm text-gray-500 mt-1">History of all sent reminders</p>
                </div>
            </div>

            <!-- Notification List -->
            <div id="notif-list" class="space-y-3">
                <!-- Loading state -->
                <div class="text-center py-12">
                    <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
                    <p class="text-sm text-gray-500 mt-3">Loading notifications...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Bottom Nav (mobile) -->
    <nav class="bottom-nav md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 flex justify-around py-2 px-4">
        <a href="dashboard.html" class="bottom-nav-link flex flex-col items-center gap-1 text-xs font-medium text-gray-400">
            <span class="text-lg">📊</span><span>Home</span>
        </a>
        <a href="notifications.html" class="bottom-nav-link active flex flex-col items-center gap-1 text-xs font-medium">
            <span class="text-lg">🔔</span><span>Notifications</span>
        </a>
    </nav>

    <script src="js/api.js?v=2"></script>
    <script src="js/notifications.js?v=2"></script>
</body>
</html>
