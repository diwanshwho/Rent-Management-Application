<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Rent Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <!-- Sidebar (desktop only, hidden on mobile) -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-60 bg-white border-r border-gray-100 z-40 transform -translate-x-full md:translate-x-0 transition-transform">
        <div class="p-5 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center"><span class="text-lg">🏠</span></div>
                <span class="font-bold text-gray-800">Rent Manager</span>
            </div>
        </div>
        <nav class="p-3 space-y-1">
            <a href="dashboard.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium">
                <span>📊</span> Dashboard
            </a>
            <a href="notifications.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600">
                <span>🔔</span> Notifications
            </a>
        </nav>
        <div class="absolute bottom-4 left-3 right-3">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100 transition">
                <span>🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Mobile header (sticky) -->
    <header class="md:hidden bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-30">
        <button onclick="toggleSidebar()" class="text-gray-600 text-xl p-1">☰</button>
        <span class="font-bold text-gray-800">Dashboard</span>
        <button onclick="logout()" class="text-gray-500 text-sm p-1">Logout</button>
    </header>

    <!-- Main Content -->
    <main class="md:ml-60 p-4 md:p-6 pb-24 md:pb-6">

        <!-- Header row -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6 gap-3">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800">Dashboard</h1>
                <div class="flex items-center gap-2 mt-1">
                    <button onclick="prevMonth()" class="p-1 rounded hover:bg-gray-200 text-gray-500 hover:text-gray-800 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    </button>
                    <p class="text-gray-500 text-sm" id="month-label"></p>
                    <button onclick="nextMonth()" class="p-1 rounded hover:bg-gray-200 text-gray-500 hover:text-gray-800 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
            <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 md:py-2 rounded-lg text-sm font-medium transition w-full md:w-auto">
                + Add Tenant
            </button>
        </div>

        <!-- Stat Cards (2x2 grid) -->
        <div class="grid grid-cols-2 gap-3 md:gap-4 mb-6" id="stat-cards">
            <div class="stat-card bg-white rounded-xl p-4 md:p-5 shadow-sm border border-indigo-100 bg-indigo-50/50">
                <p class="text-xs md:text-sm text-indigo-600">Active Tenants</p>
                <p class="text-xl md:text-2xl font-bold text-indigo-700 mt-1" id="stat-active">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-4 md:p-5 shadow-sm border border-emerald-100 bg-emerald-50/50">
                <p class="text-xs md:text-sm text-emerald-600">Paid</p>
                <p class="text-xl md:text-2xl font-bold text-emerald-700 mt-1" id="stat-paid">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-4 md:p-5 shadow-sm border border-amber-100 bg-amber-50/50">
                <p class="text-xs md:text-sm text-amber-600">Pending</p>
                <p class="text-xl md:text-2xl font-bold text-amber-700 mt-1" id="stat-pending">-</p>
            </div>
            <div class="stat-card bg-white rounded-xl p-4 md:p-5 shadow-sm border border-rose-100 bg-rose-50/50">
                <p class="text-xs md:text-sm text-rose-600">Overdue</p>
                <p class="text-xl md:text-2xl font-bold text-rose-700 mt-1" id="stat-overdue">-</p>
            </div>
        </div>

        <!-- Collection Summary (2 col) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 mb-6">
            <div class="bg-white rounded-xl p-4 md:p-5 shadow-sm border border-emerald-100">
                <h3 class="font-semibold text-gray-700 mb-1 text-sm md:text-base">Total Collected</h3>
                <p class="text-2xl md:text-3xl font-bold text-emerald-600" id="total-collected">₹0</p>
            </div>
            <div class="bg-white rounded-xl p-4 md:p-5 shadow-sm border border-amber-100">
                <h3 class="font-semibold text-gray-700 mb-1 text-sm md:text-base">Pending Amount</h3>
                <p class="text-2xl md:text-3xl font-bold text-amber-600" id="total-pending">₹0</p>
            </div>
        </div>

        <!-- Action Buttons Row -->
        <div class="flex flex-col md:flex-row gap-2 md:gap-3 mb-6">
            <button onclick="generateRents()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 md:py-2 rounded-lg text-sm font-medium transition w-full md:w-auto">
                Generate Rents
            </button>
            <button onclick="markOverdue()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2.5 md:py-2 rounded-lg text-sm font-medium transition w-full md:w-auto">
                Mark Overdue
            </button>
        </div>

        <!-- Tenant List Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100">
            <div class="p-4 md:p-5 border-b border-gray-100">
                <h3 class="font-semibold text-gray-700 text-sm md:text-base">All Tenants</h3>
            </div>

            <!-- Desktop table (hidden on mobile) -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-xs text-gray-500 uppercase border-b border-gray-100">
                            <th class="px-5 py-3">Tenant Name</th>
                            <th class="px-5 py-3">Room</th>
                            <th class="px-5 py-3">Rent</th>
                            <th class="px-5 py-3">Status</th>
                            <th class="px-5 py-3">Paid</th>
                            <th class="px-5 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tenant-table"></tbody>
                </table>
            </div>

            <!-- Mobile cards (hidden on desktop) -->
            <div class="md:hidden p-3" id="tenant-cards"></div>

            <!-- Empty state -->
            <p id="no-tenants-msg" class="hidden text-center text-gray-400 py-8 text-sm">No active tenants found.</p>
        </div>
    </main>

    <!-- Sidebar overlay for mobile -->
    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/30 z-30 md:hidden" onclick="toggleSidebar()"></div>

    <!-- Bottom navigation (mobile only) -->
    <nav class="bottom-nav md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 flex justify-around py-2 px-4">
        <a href="dashboard.html" class="bottom-nav-link active flex flex-col items-center gap-1 text-xs font-medium">
            <span class="text-lg">📊</span><span>Home</span>
        </a>
        <a href="notifications.html" class="bottom-nav-link flex flex-col items-center gap-1 text-xs font-medium text-gray-400">
            <span class="text-lg">🔔</span><span>Notifications</span>
        </a>
    </nav>

    <!-- Add Tenant Modal -->
    <div id="add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
        <div class="modal-backdrop absolute inset-0" onclick="closeModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-y-auto z-10">
            <div class="p-5 border-b border-gray-100 flex items-center justify-between">
                <h2 class="font-bold text-gray-800 text-lg">Add Tenant</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <form id="add-tenant-form" onsubmit="addTenant(event)" class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" name="name" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" name="phone" required placeholder="10 digit mobile number"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Room Number</label>
                    <input type="text" name="room_number" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Rent</label>
                    <input type="number" name="monthly_rent" required min="1"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Rent Due Day (1-28)</label>
                    <input type="number" name="rent_due_day" required min="1" max="28" value="1"
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Join Date</label>
                    <input type="date" name="join_date" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-medium transition">
                    Add Tenant
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
