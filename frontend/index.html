<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Manager - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-emerald-50 min-h-screen flex items-center justify-center">
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <div class="w-full max-w-md px-6">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-3xl">🏠</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Rent Manager</h1>
            <p class="text-gray-500 mt-1">Sign in to manage your PG</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" required
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        placeholder="admin@rentmanager.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        placeholder="••••••••">
                </div>
                <button type="submit" id="login-btn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                    Sign In
                </button>
            </form>
            <p id="error-msg" class="text-rose-500 text-sm text-center mt-3 hidden"></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken()) window.location.href = "dashboard.html";

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("login-btn");
            const errMsg = document.getElementById("error-msg");
            errMsg.classList.add("hidden");

            btn.innerHTML = '<div class="spinner mx-auto"></div>';
            btn.disabled = true;

            try {
                const data = await apiPost("/auth/login", {
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                });
                if (data && data.access_token) {
                    setToken(data.access_token);
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                errMsg.textContent = err.message;
                errMsg.classList.remove("hidden");
            } finally {
                btn.innerHTML = "Sign In";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
