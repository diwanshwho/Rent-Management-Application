<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants - Rent Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <!-- Sidebar (desktop only) -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-60 bg-white border-r border-gray-100 z-40 transform -translate-x-full md:translate-x-0 transition-transform">
        <div class="p-5 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center"><span class="text-lg">🏠</span></div>
                <span class="font-bold text-gray-800">Rent Manager</span>
            </div>
        </div>
        <nav class="p-3 space-y-1">
            <a href="dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span>📊</span> Dashboard</a>
            <a href="tenants.html" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"><span>👥</span> Tenants</a>
            <a href="payments.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span>💰</span> Payments</a>
            <a href="electricity.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600"><span>⚡</span> Electricity</a>
        </nav>
        <div class="absolute bottom-4 left-3 right-3">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:bg-gray-100">
                <span>🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Mobile header (sticky) -->
    <header class="md:hidden bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-30">
        <button onclick="toggleSidebar()" class="text-gray-600 text-xl p-1">☰</button>
        <span class="font-bold text-gray-800">Tenants</span>
        <button onclick="logout()" class="text-gray-500 text-sm p-1">Logout</button>
    </header>

    <!-- Main -->
    <main class="md:ml-60 p-4 md:p-6">
        <div class="flex items-center justify-between mb-4 md:mb-6">
            <h1 class="text-xl md:text-2xl font-bold text-gray-800">Tenants</h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 md:py-2 rounded-lg text-sm font-medium transition min-h-[44px] md:min-h-0">
                + Add Tenant
            </button>
        </div>

        <!-- Desktop Table -->
        <div class="hidden md:block bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="text-left text-xs text-gray-500 uppercase border-b border-gray-100">
                        <th class="px-5 py-3">Name</th>
                        <th class="px-5 py-3">Phone</th>
                        <th class="px-5 py-3">Room</th>
                        <th class="px-5 py-3">Rent</th>
                        <th class="px-5 py-3">Due Day</th>
                        <th class="px-5 py-3">Status</th>
                        <th class="px-5 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="tenants-table"></tbody>
            </table>
        </div>

        <!-- Mobile Cards -->
        <div id="tenants-cards" class="md:hidden space-y-3"></div>

        <!-- Empty message (shared) -->
        <p id="empty-msg" class="hidden text-center text-gray-400 py-8 text-sm">No tenants yet. Click "Add Tenant" to get started.</p>
    </main>

    <!-- Add/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center">
        <div class="modal-backdrop absolute inset-0" onclick="closeModal()"></div>
        <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-xl w-full max-w-md md:mx-4 relative z-10 max-h-[90vh] overflow-y-auto">
            <div class="p-5 md:p-6 border-b border-gray-100 sticky top-0 bg-white rounded-t-2xl md:rounded-t-2xl z-10">
                <h2 id="modal-title" class="text-lg font-semibold text-gray-800">Add Tenant</h2>
            </div>
            <form id="tenant-form" class="p-5 md:p-6 space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                    <input type="text" id="f-name" required class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                        <input type="tel" id="f-phone" required class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Room *</label>
                        <input type="text" id="f-room" required placeholder="e.g. 101" class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Rent (₹) *</label>
                        <input type="number" id="f-rent" required min="0" class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Due Day (1-28)</label>
                        <input type="number" id="f-due-day" min="1" max="28" value="1" class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Join Date *</label>
                    <input type="date" id="f-join" required class="w-full px-3 py-2.5 md:py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-base md:text-sm">
                </div>
                <div class="flex gap-3 pt-2 pb-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 md:py-2 rounded-lg text-sm font-medium transition min-h-[44px] md:min-h-0">Cancel</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 md:py-2 rounded-lg text-sm font-medium transition min-h-[44px] md:min-h-0">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/30 z-30 md:hidden" onclick="toggleSidebar()"></div>

    <!-- Bottom Navigation (mobile only) -->
    <nav class="bottom-nav md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 flex justify-around py-2 px-4">
        <a href="dashboard.html" class="bottom-nav-link flex flex-col items-center gap-1 text-xs font-medium text-gray-400">
            <span class="text-lg">📊</span><span>Dashboard</span>
        </a>
        <a href="tenants.html" class="bottom-nav-link active flex flex-col items-center gap-1 text-xs font-medium">
            <span class="text-lg">👥</span><span>Tenants</span>
        </a>
        <a href="payments.html" class="bottom-nav-link flex flex-col items-center gap-1 text-xs font-medium text-gray-400">
            <span class="text-lg">💰</span><span>Payments</span>
        </a>
        <a href="electricity.html" class="bottom-nav-link flex flex-col items-center gap-1 text-xs font-medium text-gray-400">
            <span class="text-lg">⚡</span><span>Electricity</span>
        </a>
    </nav>

    <script src="js/api.js"></script>
    <script src="js/tenants.js"></script>
</body>
</html>
